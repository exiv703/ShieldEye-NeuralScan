name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.5.7"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: python -m pip install "ruff==${RUFF_VERSION}"

      # Rules and excludes come from ruff.toml.
      - name: Ruff
        run: ruff check .

  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Belt and braces: never reach Hugging Face from CI.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # The AI stack (torch, transformers, ...) is several GB and only used
      # for optional explanations. Without it the scanner runs heuristic-only,
      # and the AI path is covered by tests/test_ai_mocked.py with a fake model.
      - name: Install dependencies (without the AI stack)
        run: |
          grep -viE '^(torch|transformers|accelerate|safetensors)\b' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements-ci.txt"

      - name: pytest
        run: python -m pytest -v
